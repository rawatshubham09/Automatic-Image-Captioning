<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Caption Prediction</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: url('https://www.example.com/background.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .navbar-custom {
            background-color: #343a40;
        }
        .navbar-custom .navbar-brand, .navbar-custom .navbar-nav .nav-link {
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <svg class="bi" width="32" height="32" fill="white">
            <use xlink:href="bootstrap-icons.svg#toggles"/>
        </svg>
        <a class="navbar-brand" href="#">Home</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Artifacts</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Logs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Online Images</a>
                </li>
            </ul>
            <a class="btn btn-outline-light my-2 my-sm-0" href="#">Admin LogIn</a>
        </div>
    </nav>
    <div class="container mt-5">
        <h1 class="text-center text-light">Image Caption Prediction</h1>
        <form id="uploadForm" enctype="multipart/form-data" class="text-center">
            <div class="form-group">
                <input type="file" id="imageInput" name="image" accept="image/*" class="form-control-file" onchange="previewImage(event)">
            </div>
            <button type="button" class="btn btn-primary" onclick="uploadImage()">Upload Image</button>
        </form>
        <div id="imagePreview" class="mt-4 text-center"></div>
        <div id="predictionResult" class="mt-4 text-center text-light"></div>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.createElement('img');
                output.src = reader.result;
                output.style.maxWidth = '100%';
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('imagePreview').appendChild(output);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function uploadImage() {
            const formData = new FormData(document.getElementById('uploadForm'));
            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('predictionResult').innerText = `Prediction: ${data.prediction}`;
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
