<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Caption Prediction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Image Caption Prediction</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="imageInput" name="image" accept="image/*" onchange="previewImage(event)">
            <button type="button" onclick="uploadImage()">Upload Image</button>
        </form>
        <div id="imagePreview"></div>
        <div id="predictionResult"></div>
    </div>
    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.createElement('img');
                output.src = reader.result;
                output.style.maxWidth = '100%';
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('imagePreview').appendChild(output);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function uploadImage() {
            const formData = new FormData(document.getElementById('uploadForm'));
            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('predictionResult').innerText = `Prediction: ${data.prediction}`;
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
